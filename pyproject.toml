[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yada-agent"
version = "0.1.0"
description = "Yet Another DeepSeek Agent: a small, auditable coding-agent harness for DeepSeek V4."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yada contributors" }]
keywords = ["deepseek", "coding-agent", "agent", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
# Intentional: the runtime uses urllib, dataclasses, pathlib, and other stdlib
# modules. Heavy orchestration frameworks are neither direct nor transitive deps.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
yada = "yada.run.cli:main"
yada-trace = "yada.traces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
