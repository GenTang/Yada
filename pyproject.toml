[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yada-agent"
version = "0.1.0"
description = "Yet Another DeepSeek Agent: a small, auditable coding-agent harness for DeepSeek."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TANG Gen" }]
keywords = ["deepseek", "coding-agent", "agent", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
yada = "yada.cli:main"

[tool.setuptools.packages.find]
include = ["yada*"]
