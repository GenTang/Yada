name: 💡 Feature or Enhancement
description: 建议新功能、Tool 或架构改进 / Suggest a feature or architectural improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交建议！为了保持 Yada "足够小且致命" 的特性，请详细描述这个新功能的必要性。
        Thanks for your interest in improving Yada! Please provide clear context.

  - type: checkboxes
    id: existing-issues
    attributes:
      label: 已有 Issue / Existing Issues
      options:
        - label: 我已搜索过现有 issues，没有找到重复项。 / I searched existing issues and found no duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 痛点与背景 / Problem and Context
      description: 请描述具体用例、当前行为，以及它为什么值得增加 Agent 复杂度。
      placeholder: What is difficult today, and who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 / Proposed Solution
      description: 描述最小可行设计、用户接口和数据流。架构改动请说明边界。
      placeholder: What is the smallest useful change?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 验收标准 / Acceptance Criteria
      description: 用可检查的 checklist 说明什么算完成。
      placeholder: |
        - [ ] Observable behavior...
        - [ ] Tests cover...
    validations:
      required: true

  - type: textarea
    id: evaluation-impact
    attributes:
      label: 评测、Token 与延迟影响 / Evaluation, Token, and Latency Impact
      description: 说明如何衡量改进，以及可能的 token、延迟或磁盘成本。不适用时请填 N/A。
      placeholder: Benchmark cases, expected metric movement, and cost trade-offs.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标 / Scope and Non-goals
      description: 说明这个提议有意不解决什么，防止 MVP 膨胀。
      placeholder: In scope / Out of scope
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives Considered
      description: 有没有其他更轻量级的方式可以实现这个目标？
      placeholder: Any other approaches or tools you've considered...
    validations:
      required: false

  - type: checkboxes
    id: pr
    attributes:
      label: 贡献意向 (Contribution)
      options:
        - label: 我愿意为此提交一个 PR (I am willing to submit a PR to implement this)
