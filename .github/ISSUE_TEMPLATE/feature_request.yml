name: 💡 Feature or Enhancement
description: 建议新功能、Tool 或架构改进 / Suggest a feature or architectural improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 痛点与背景 / Problem and Context
      description: 请描述具体用例、当前行为，以及这个问题带来的影响。
      placeholder: What is difficult today, and who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 / Proposed Solution
      description: 如果你有想法，请描述期望的行为或最小可行方案。没有方案也可以留空。
      placeholder: What would you like Yada to do?
    validations:
      required: false
