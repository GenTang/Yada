name: 🐛 Bug Report
description: 报告可复现的错误或回归 / Report a reproducible defect or regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么？ / What Happened?
      description: 请简洁描述实际行为和问题影响。
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 如何复现？ / How to Reproduce?
      description: 请提供最小复现步骤和完整命令；必要时包含 Yada 版本、OS、Python、uv 和 model。
      placeholder: |
        1. Prepare...
        2. Run...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为 / Expected Behavior
      description: Yada 应该做什么？
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 其他信息 / Additional Context or Trace
      description: 可选填写已脱敏的日志、trace 或截图。请勿包含 API key、Authorization header 或其他 secrets。
    validations:
      required: false
